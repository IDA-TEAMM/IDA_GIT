# pytest yapılandırması — NEDEN VAR (2026-08-06'da ölçüldü, tahmin değil)
#
# Repo kökünde `pytest` çalıştırınca TEK TEST BİLE KOŞMUYORDU:
#   ERROR scripts/duba_kamera_test.py - RuntimeError: Cannot load blob,
#   file at path /home/girdap/models/yolo11n_duba_rvc2.blob doesn't exist.
#   !!! Interrupted: 1 error during collection !!!
# Sebep: pytest'in varsayılan `python_files` deseni `test_*.py` VE `*_test.py`.
# `scripts/duba_kamera_test.py` ikincisine uyuyor → pytest onu test modülü sanıp
# IMPORT ediyor; o dosya masa testi betiği olduğu için modül seviyesinde
# `sdn.setBlobPath(...)` çağırıyor ve model dosyası olmayan her makinede
# (yani BUGÜN her makinede) toplama aşamasında sert hata veriyor.
#
# Sonucu neden ciddi: "104 test geçiyor" ancak `pytest girdap_ida_algi/test`
# ile doğru; kökten koşan kişi ya kodu bozuk sanır ya da — daha kötüsü —
# hatayı görüp "testler koştu" varsayar. Sahada/telaşlı oturumda ikisi de pahalı.
#
# Çözüm iki katmanlı (biri yetiyor, ikisi birlikte niyeti de belgeliyor):
#   testpaths    : argümansız çağrıda yalnız gerçek test dizinine bak
#   python_files : `*_test.py` desenini KALDIR → scripts/ altındaki masa testi
#                  betikleri (duba_kamera_test.py, kamera_goruntu_test.py)
#                  bir daha asla test sanılmaz
# ⚠️ Dosya adlarını DEĞİŞTİRMEDİK: `duba_kamera_test.py` saha runbook'unda
# (docs/hubai_model_rehberi.md §5) ve jetson_kontrol.sh'de adıyla geçiyor.
#
# `colcon test` etkilenmez: colcon pytest'i paket dizininde AÇIK argümanlarla
# çağırır, `testpaths` yalnız argümansız çağrıda devreye girer.
[pytest]
testpaths = girdap_ida_algi/test
python_files = test_*.py
norecursedirs = .git scripts models docs
