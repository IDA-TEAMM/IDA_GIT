# Mitras İtki Analizi Raporundan (SolidWorks CFD, Nisan 2026)
catamaran:
  # 2026-08-05 (kaptan kararı): 30.0 → 11.8. Eski değer "mekanik ekipten onay
  # bekliyor" notuyla duruyordu ve GERÇEK teknenin 2,5 KATIYDI → MPPI var
  # olmayan bir tekneyi simüle ediyordu (ataleti fazla, ivmelenmesi yavaş).
  mass: 11.8              # kg - ÖLÇÜLEN tekne (GIRDAP_DURUM §1)
  # 🔴 AÇIK — kütleyle BİRLİKTE düşmesi gerekiyordu, henüz düşürülmedi.
  # 11,8 kg / 1,03 × 0,78 m bir tekne için:
  #     dikdörtgen yaklaşımı  I_z = m(L²+B²)/12 = 1.64 kg·m²
  #     teorik ÜST SINIR (tüm kütle dört köşede) = 4.92 kg·m²
  # Yani 5.0, üst sınırın da üstünde: jirasyon yarıçapı 0.651 m çıkıyor,
  # oysa teknenin YARI BOYU 0.515 m. Sonuç: model dönüşe gerçekte olduğundan
  # ~3× fazla direnir → MPPI yaw komutlarını gereğinden sert seçer, kapı
  # ortasına nişan alırken dönüş gecikir. Değiştirmek AYRI karar (bkz. §0.5).
  inertia_z: 5.0          # kg·m² - ⚠ 11.8 kg ile TUTARSIZ, önerilen 1.64
  # 🔴 AÇIK — sürükleme HÂLÂ ~6× yanlış; kütleden BAĞIMSIZ bir hata.
  # Terminal hız 2·T/|Xu| = 2·30/8 = 7.5 m/s öngörüyor; ölçülen tam gaz
  # 1.26 m/s (log 58). 1.26 için Xu ≈ -47.6 gerekirdi (2 motor, T=30 N).
  # ⚠ Doğrudan -47.6 YAZMA: max_thrust=30 N CFD değeri, gerçek itki
  # ölçülmedi — iki bilinmeyen tek denklem. Sabit-gaz step testi şart (§7).
  Xu: -8.0                # N·s/m - saha testinde kalibre edilecek
  Yv: -12.0               # N·s/m
  Nr: -3.0                # N·m·s/rad
  thruster_spacing: 0.596 # m - GERÇEK DEĞER (596.32 mm)
  max_thrust: 30.0        # N - tek motor maks (5000+ RPM)
  # RPM → Newton tablosu:
  # 1000 RPM → 0.85 N
  # 2500 RPM → 6.5 N
  # 5000 RPM → 26.0 N
  # 5500 RPM → ~30 N (max)

# Sinüsoidal dalga bozucusu (Deniz Durumu-2 yaklaşık modeli).
# enabled=false → derivatives(t) tamamen geriye uyumlu (t göz ardı edilir).
# Saha kalibrasyonunda ölçülen dalga spektrumuna göre tune edilecek.
wave:
  enabled: false          # Demo'da true yapılarak Deniz Durumu-2 simüle edilir
  Fx_amp: 5.0             # N, ileri eksen bozucu genliği
  Fx_freq: 0.5            # Hz, ~2 s periyot (DD-2 tipik)
  Mz_amp: 1.0             # N·m, yaw bozucu genliği
  Mz_freq: 0.3            # Hz, ~3.3 s periyot
  phase: 0.0              # rad, sinüs başlangıç fazı
