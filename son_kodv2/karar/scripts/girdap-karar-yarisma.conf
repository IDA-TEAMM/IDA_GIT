# GİRDAP İDA — YARIŞMA GÜNÜ systemd drop-in'i (girdap-karar.service üzerine)
#
# NE YAPAR: ROS 2 DDS trafiğini Jetson'ın İÇİNE hapseder — hiçbir ROS mesajı
# ağ arayüzlerine (ethernet / varsa WiFi) çıkmaz.
#
# NEDEN — iki ayrı gerekçe:
#
#  1) ŞARTNAME md 4.1 — "YKİ'lerde görüntü işleme, sensör işleme ya da otonomi
#     kabiliyeti olmayacaktır. Bahse konu bütün yazılımlar ilgili araçların
#     üzerinde koşacaktır." Ayrıca İDA↔YKİ arası yalnız telekomut/telemetri
#     modülleri kullanılabilir. ROS topic'leri laptop'tan görünür durumdayken
#     "yanlışlıkla" yer tarafında bir node koşturmak mümkün olur; bu bayrak o
#     ihtimali YAPISAL olarak kapatır. (Görev telemetrisi zaten ayrı hattan —
#     MAVLink/RFD868 üzerinden Mission Planner'a — gidiyor, ondan etkilenmez.)
#
#  2) PRATİK — Livox Mid-360 ethernet üzerinden UDP ile 10 Hz'te ~20k nokta
#     basıyor (192.168.117.0/24). DDS keşif (discovery) multicast'i varsayılan
#     olarak TÜM arayüzlere gider, yani aynı hattı gereksiz yere paylaşır.
#     Localhost'a hapsetmek LiDAR hattını temiz bırakır.
#
# ⚠️ NE ZAMAN AÇILIR: yalnız yarışma/video günü. AÇIKKEN LAPTOP'TAN
#    `ros2 topic echo` ÇALIŞMAZ — bu bilinçli. Geliştirme ve masa testinde
#    KAPALI kalmalı (2026-07-13'te operatörün servisi görememesi tam bu yüzden
#    yaşanmıştı; ROS_DOMAIN_ID=42 o iş için serviste zaten duruyor).
#
# KURULUM (yarışma sabahı):
#   sudo mkdir -p /etc/systemd/system/girdap-karar.service.d
#   sudo cp girdap-karar-yarisma.conf /etc/systemd/system/girdap-karar.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-karar
#
# DOĞRULAMA (Jetson'da, yığın koşarken):
#   systemctl show girdap-karar -p Environment | grep LOCALHOST   # =1 görmeli
#   ros2 topic list                                               # Jetson'da DOLU
#   # laptop'ta:  ros2 topic list                                 # BOŞ olmalı
#
# GERİ ALMA (test/geliştirmeye dönüş):
#   sudo rm /etc/systemd/system/girdap-karar.service.d/girdap-karar-yarisma.conf
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-karar

[Service]
Environment=ROS_LOCALHOST_ONLY=1
