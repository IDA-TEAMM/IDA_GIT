# GİRDAP İDA — YARIŞMA GÜNÜ ağ izolasyonu drop-in'i
# (girdap-algi / girdap-livox / girdap-rosbag / girdap-saat-gec üzerine)
#
# 🔴 NEDEN VAR — 2026-08-16 akşamı ÖLÇÜLDÜ, tahmin değil:
#
# `girdap-karar-yarisma.conf` yalnız KARAR servisine `ROS_LOCALHOST_ONLY=1`
# veriyordu. O bayrak DDS keşfini loopback'e hapsediyor; bayrağı OLMAYAN
# süreçler AYRI bir keşif dünyasında kalıyor. Yani yarışma drop-in'i tek
# başına kurulunca **algı ile karar birbirini HİÇ görmüyor**.
#
# Ölçüm (Jetson, ROS_DOMAIN_ID=42, `ros2 node list --no-daemon`, iki ayrı
# kabuk — `ros2 daemon` önbelleği kapatılarak):
#   ROS_LOCALHOST_ONLY yokken : /girdap_saat_gec /duba_gecis_navigator …
#                               (karar yığınının ~25 node'u GÖRÜNMÜYOR)
#   ROS_LOCALHOST_ONLY=1 iken : /fsm_node /kamikaze_param_node …
#                               (algı node'u GÖRÜNMÜYOR)
#
# Sonucu: `/perception/buoys` karar tarafına ULAŞMAZ ⇒ kapı takibi yok,
# sınıflı engel yok ⇒ **P1 + P2 = 0**. Ve belirtisi YOK: planning_node
# *"engel haritası HİÇ gelmedi"* der, ama aynı satır LiDAR takılı değilken
# de basılıyor ⇒ operatör bunu donanım eksiği sanar.
#
# ⚠️ İKİSİ BİRLİKTE KURULUR: `girdap-karar-yarisma.conf` kuruluysa bu dosya
#    da kurulacak. Biri diğeri olmadan = sessiz kopukluk.
#
# ⚠️ Humble'da doğru mekanizma BUDUR: `ROS_LOCALHOST_ONLY` Iron'da deprecate
#    edilip yerine `ROS_AUTOMATIC_DISCOVERY_RANGE` geldi, ama o değişken
#    **Humble'da YOK** (docs.ros.org "Improved Dynamic Discovery" sayfası
#    Iron/Jazzy/Kilted/Rolling'de var, Humble'da yok — 16.08.2026'da bakıldı).
#    Sürüm yükseltmeden bu dosyayı yeni değişkene çevirme.
#
# KURULUM (yarışma sabahı, karar drop-in'iyle BİRLİKTE):
#   for S in girdap-algi girdap-livox girdap-rosbag girdap-saat-gec; do
#     sudo mkdir -p /etc/systemd/system/$S.service.d
#     sudo cp girdap-yarisma-localhost.conf /etc/systemd/system/$S.service.d/
#   done
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-algi
#
# DOĞRULAMA (yığın koşarken, tek kabuk):
#   export ROS_DOMAIN_ID=42 ROS_LOCALHOST_ONLY=1
#   ros2 daemon stop && ros2 node list --no-daemon
#     → HEM /duba_gecis_navigator HEM /planning_node aynı listede olmalı
#
# GERİ ALMA (geliştirme/masa testi):
#   sudo rm /etc/systemd/system/girdap-*.service.d/girdap-yarisma-localhost.conf
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-algi

[Service]
Environment=ROS_LOCALHOST_ONLY=1
