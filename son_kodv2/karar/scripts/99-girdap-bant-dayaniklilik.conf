# GİRDAP İDA — çekirdek yazma gecikmesi: ani güç kesintisinde kayıp penceresi.
# Kurulum: sudo cp 99-girdap-bant-dayaniklilik.conf /etc/sysctl.d/
#          sudo sysctl --system
#
# 12.08.2026 (§0.53). Kaptan: "bu rosbag'i aniden Jetson kapansa bile
# çalışacak şekilde ayarla."
#
# NEDEN GEREKLİ: MCAP'i parça düzeyinde sıkıştırıp 60 sn'de bir bölmek
# rosbag2 tarafını çözer — ama `write()` verinin DİSKE indiği anlamına gelmez,
# yalnız çekirdeğin sayfa önbelleğine (page cache) girdiği anlamına gelir.
# Fişi çeken bir kesinti o önbelleği de götürür.
#
# ÖLÇÜLEN VARSAYILANLAR (bu Jetson, JetPack 6.2 / çekirdek 5.15):
#   vm.dirty_expire_centisecs    = 3000  → kirli sayfa 30 SANİYE bekleyebilir
#   vm.dirty_writeback_centisecs =  500  → yazma iş parçacığı 5 sn'de bir uyanır
# Yani MCAP tarafı kusursuz olsa bile ani kesintide 30 saniyeye kadar kayıt
# uçabilirdi. 2 m/s'de 30 saniye = 60 metrelik seyir kaydı.

# Kirli sayfa en fazla 3 saniye bekler (30 sn → 3 sn).
vm.dirty_expire_centisecs = 300

# Yazma iş parçacığı saniyede bir uyanır (5 sn → 1 sn).
vm.dirty_writeback_centisecs = 100

# Arka plan yazımı belleğin %5'i kirlendiğinde başlasın (%10 → %5) — yazım
# erken ve küçük parçalar hâlinde aksın, sonda tek büyük yığın birikmesin.
vm.dirty_background_ratio = 5

# ⚠ BEDEL: disk yazımı daha sık ve daha küçük parçalar hâlinde olur.
# `girdap-rosbag` zaten `IOSchedulingClass=idle` + `Nice=10` ile koşuyor
# (KAR-09), yani bu ek G/Ç kontrol döngüsünün önüne geçmez.
# ⚠ Sistem geneline etki eder (yalnız rosbag'e değil) — bu makine bir kayıt
# cihazı olduğu için bilinçli tercih.
