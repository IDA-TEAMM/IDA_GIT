# GİRDAP İDA — PARKUR-1 KOŞUSU systemd drop-in'i (girdap-karar.service üzerine)
#
# NE YAPAR: yarışma ayarlarını (yarisma.yaml) uygular ve ÜSTÜNE parkur1.yaml'ı
# bindirir → görev etiketleri `parkur1_mission.yaml`'dan okunur (hepsi 1).
#
# 🔴 NEDEN GEREKLİ: P1'i tek başına koşarken competition_mission.yaml
#    etiketleri ([1,1,2,2,3]) kullanılırsa 2. waypoint'te PARKUR_2'ye,
#    4. waypoint'te **PARKUR_3 = KAMİKAZE MODU**'na geçilir (hedefe Gaussian
#    çekici + w_track 1.0) — tekne P1 noktasının üstüne sürer ve FSM 3 g şok
#    bekler. P1 testinde hem yanlış hem tehlikeli. parkur1.yaml bu geçişleri
#    yapısal olarak kapatır.
#
# ⚠ ROS_LOCALHOST_ONLY BİLEREK YOK: P1 su testinde laptop'tan
#   `ros2 topic echo /girdap/planning/gate_count` ile kapı sayacını izlemek
#   isteriz. Yarışma günü bu dosya kaldırılıp girdap-karar-yarisma.conf
#   kurulur (o md 4.1 için ağı kapatır). İKİSİ AYNI ANDA KURULMAZ.
#
# KURULUM (P1 test sabahı):
#   sudo mkdir -p /etc/systemd/system/girdap-karar.service.d
#   sudo rm -f /etc/systemd/system/girdap-karar.service.d/girdap-karar-yarisma.conf
#   sudo cp girdap-karar-parkur1.conf /etc/systemd/system/girdap-karar.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-karar
#
# DOĞRULAMA:
#   journalctl -u girdap-karar | grep 'config overlay UYGULANDI'
#     → İKİ satır: yarisma.yaml, sonra parkur1.yaml
#   ros2 topic echo /girdap/mission/state      # PARKUR1 (P2/P3'e GEÇMEMELİ)
#
# GERİ ALMA:
#   sudo rm /etc/systemd/system/girdap-karar.service.d/girdap-karar-parkur1.conf
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-karar

[Service]
Environment=GIRDAP_CONFIG_OVERLAY=yarisma.yaml:parkur1.yaml
