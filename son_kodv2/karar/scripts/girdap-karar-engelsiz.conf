# GİRDAP İDA — ENGEL BEKÇİSİ KAPALI systemd drop-in'i (girdap-karar.service üzerine)
#
# NE YAPAR: `planning.obstacle_timeout_s:=0.0` ekler → F-P.2 engel bekçisi
# devre dışı kalır, `planning_node` engel haritası HİÇ gelmese de itkiyi
# sıfırlamaz.
#
# 🔴 NEDEN VAR (15.08.2026 göl koşumu, GIRDAP_DURUM §1.08a):
#    Tekne bizim yazılımla BİR KEZ BİLE sürmedi. Zincirin tamamı çalışıyordu —
#    GUIDED geldi, FSM PARKUR1'e geçti, setpoint 6 Hz aktı — ama itki her
#    turda sıfırlandı; kilit `ENGEL-YOK`. Sebep LiDAR'ın fiziksel olarak ölü
#    olması (`Link detected: no`): `/perception/obstacle_map` yayıncısı ayakta
#    ama HİÇ mesaj üretmiyor. Kaptanın göl seansı bu yüzden boşa gitti.
#
# ⛔⛔ BUNU KURMAK NE DEMEK — AÇIKÇA:
#    MPPI **boş engel torbasıyla** koşar. Boş torba "önüm tamamen açık"
#    demektir → araç, engel GÖREMEDİĞİNDEN HABERSİZ, tam güvenle sürer.
#    (F-P.2/KAR-03'ün tarif ettiği tuzağın ta kendisi.)
#    Savunulabilir olduğu TEK durum: **Parkur-1** (tanımı gereği engelsiz
#    nokta takibi) + operatör elinde MANUAL konumu ve `RC10` acil durdurması.
#
# ⛔ PARKUR-2'YE GEÇMEDEN KALDIRILMALI. LiDAR'sız P2 zaten imkânsız
#    (engel kaçınması onsuz çalışmaz, §0.63'te ölçüldü).
#
# ✅ SESSİZ DEĞİL: `planning_node` bekçi kapalıyken her açılışta
#    "🔴 ENGEL BEKCISI KAPALI (obstacle_timeout_s=0) — arac engel ..." basar
#    (planning_node.py:555). Unutulup yarışmaya girilmesin diye.
#
# KURULUM:
#   sudo cp girdap-karar-engelsiz.conf /etc/systemd/system/girdap-karar.service.d/30-engelsiz.conf
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-karar
#
# ⚠ YENİDEN BAŞLATMADAN ÖNCE EMNİYET: tekne ARM'lıysa ve `RC10` LOW ise
#   (motorlar canlı) önce acil durdurmayı HIGH'a al ya da disarm et —
#   bekçi kapalıyken GUIDED'a düşen bir yığın KARADA sürmeye kalkabilir.
#
# DOĞRULAMA:
#   systemctl show girdap-karar -p ExecStart --value | grep obstacle_timeout_s
#   journalctl -u girdap-karar | grep 'ENGEL BEKCISI KAPALI'
#   ros2 topic echo /girdap/control/inhibit_reason   # ENGEL-YOK GÖRÜNMEMELİ
#
# GERİ ALMA (Parkur-2 öncesi ZORUNLU):
#   sudo rm /etc/systemd/system/girdap-karar.service.d/30-engelsiz.conf
#   sudo systemctl daemon-reload && sudo systemctl restart girdap-karar
#
# ⚠ Numara 30: 10-cift-yigin.conf (ExecStartPre) ve 20-oncelik.conf (Nice)
#   ondan ÖNCE uygulanır; bu dosya yalnız ExecStart'ı sıfırlayıp yeniden
#   yazar, ötekilere dokunmaz.

[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/humble/setup.bash && source /home/girdap/ros2_ws/install/setup.bash && exec ros2 launch girdap_decision hardware.launch.py mission_source:=fc planning.obstacle_timeout_s:=0.0'
