# Girdap İDA — Gerçek donanım konfigürasyonu (ArduRover + Pixhawk 6C).
#
# hardware.launch.py bu dosyayı Python ile okur:
#   - fcu_url / gcs_url          → mavros apm.launch include argümanları
#   - mode_name / heartbeat_timeout_s / arming_retry_max
#                                → mavros_bridge_node parametre override'ları
#   - topics                     → sensör/perception referans isimleri
#
# NOT: Bu düz (flat) bir launch-config'idir, ROS node-scoped params dosyası
# DEĞİLDİR. Algoritma parametreleri (MPPI K/T, fusion hızları vb.) config/
# params.yaml'da kalır; hardware.launch ikisini birleştirir.

# --- MAVLink bağlantısı (Pixhawk 6C UART) ---
# F-M.9 (2026-07-14, Eyüp KARARI — USB-C'ye DÖNÜŞ YOK): Pixhawk USB-C soketi
# aralıklı kopuyor (tamir tutmadı; TRB-mid-transfer kanıtı) → hat artık
# TELEM2 üzerinden FTDI seri (ttyUSB0, 57600, MAVLink2, IMU ~8.1 Hz stabil).
# ⚠ ttyUSB0 adı kırılgan (Jetson'da 2 FTDI var, reboot'ta takas olabilir) —
#   Jetson'da udev symlink KURULU (99-girdap-fc.rules: FT231X seri no
#   DU0EFEA7 → /dev/pixhawk). fcu_url artık o symlink'i kullanır.
#   Masa/geliştirmede USB-C takılıysa eski değer: "serial:///dev/ttyACM0:57600".
#
# 🔴🔴 2026-08-12 (§0.52) — BAUD 57600 → 921600 DÜZELTİLDİ. ÖLÇÜMLE.
# Belirti: mavros_router `Remotes count` 17-38 (sağlıklı 1-3), gerçek
# otopilot adresi 1.1 HİÇ görünmüyor, `connected=false` (§0.48a/§0.50).
# Ölçüm (ham bayt, MAVLink çerçeve zincirleme testi, 6 sn/hız):
#     baud     bayt  sihirli  zincirli   oran   kaynak
#    57600     2134        1         0    %0    —
#   115200     4558       46         0    %0    —
#   921600    41895     1270      1269  %99,9   1.1 (otopilot) ×1269
#   500000    22906      155         0    %0    —
# 921600'de MAVLink2 çerçeveleri kırılmadan zincirleniyor ve TEK kaynak
# var: 1.1. Mesaj dökümü sağlıklı otopilot yayını (ATTITUDE, GPS_RAW_INT,
# SYS_STATUS, VFR_HUD, RC_CHANNELS… her biri 60 adet/6 sn = 10 Hz).
# RADIO_STATUS (109) YOK → hattın ucunda telemetri radyosu değil,
# TELEM2 FTDI kablosu var; "RF paraziti" hipotezi (F-P.24) DÜŞTÜ.
# 👉 §0.50c'nin "baud şüphesi düştü" hükmü YANLIŞTI: 57600 sabah çalıştıysa
# Pixhawk'ın SERIAL2_BAUD'u o gün 921'e değişmiş demektir (parametre
# yüklemesi/reset). Yanlış baud'da rastgele baytlar arada bir geçerli
# MAVLink başlığına benziyor → sahte "remote" adresleri = o çöp sayaç.
fcu_url: "serial:///dev/pixhawk:921600"
gcs_url: ""                       # YKİ köprüsü yok (Şartname 4.1: tek yönlü)

# --- mavros_bridge_node güvenlik/mod ayarları ---
mode_name: "GUIDED"               # ArduRover otonomi modu (kök = tek kaynak)
heartbeat_timeout_s: 5.0          # /mavros/state sessizliği → KILL (~5 heartbeat)
arming_retry_max: 3               # ArduRover pre-arm reddinde yeniden deneme

# --- Algoritma seçimi ---
# 🔑 2026-08-11 (kaptan kararı): bu dosya artık **YARIŞMA TABANI**.
# Eskiden video senaryosuydu ve yarışma değerleri yalnız `yarisma.yaml`
# overlay'inden geliyordu; overlay/drop-in kurulmazsa yığın SESSİZCE video
# modunda koşuyordu (§0.16b · §0.30d · §0.32/A3 — üç ayrı turda saha riski
# olarak kaydedildi, her seferinde elle kurulum gerektirdi).
# Video akışı SİLİNMEDİ, tersine çevrildi: `video.yaml` overlay'i.
#   GIRDAP_CONFIG_OVERLAY=video.yaml   → eski video davranışı
# Varsayılan artık güvenli tarafta: unutulan kurulum yarışma modunu bozmaz.
algorithm:
  use_isam2: true    # iSAM2/GTSAM füzyon (video: MAVROS EKF pass-through)
  use_rrt:   true    # RRT* global plan (video: current_target doğrudan MPPI'ye)
  use_mppi:  true    # MPPI her iki modda da lokal kontrolcü

# --- Görev başlatma (YARIŞMA tabanı, 2026-08-11) ---
# Görev GUIDED mod KENARIYLA başlar: operatör Manual'de ARM eder, sonra
# Mission Planner'dan GUIDED'a alır (§0.30h). Sıra terse dönerse kenar oluşmaz
# ve görev HİÇ başlamaz — F-P.23 bekçisi bunu gürültülü basar.
# Video davranışı (AUTO + start_on_arm_in_mode) için: video.yaml overlay'i.
fsm:
  start_on_mode: "GUIDED"    # BEKLEMEDE'de GUIDED'a geçiş = görev başlar
  # 🔴 YARIŞMA'da false ŞART: true olsaydı GUIDED'dayken ARM etmek de görevi
  # başlatırdı, yani arm anında MPPI motor sürerdi. Arm ile hareket ayrı kalmalı
  # (§0.30h, ilk motorlu su testinin gerekçesi).
  # Video akışının F-V.6 gereksinimi (AUTO'ya alıp sonra arm) video.yaml'de.
  start_on_arm_in_mode: false

bridge:
  # Yarışmada köprü GUIDED'ı talep EDER (MPPI'nin cmd_vel'i ancak GUIDED'da
  # geçer). F14.3 geçidi: yalnız görev zaten aktifken basılır, mod kenarını
  # kendisi ÇALAMAZ (§0.30h). Video modunda false — FC'yi AUTO görevinden atmasın.
  auto_guided: true
  # F-M.6: bağlantı kurulunca FC'den istenen MAVLink akış hızı (Hz).
  # 10 Hz = yığının GERÇEK ihtiyacı: MPPI control_rate 10 Hz + Ekran-2 grafik
  # CSV'si 10 Hz. Dünkü elle istek 50 Hz'di (ölçülen 39 Hz) — gereksiz yüktü.
  # ⚠ ALT SINIR: fusion_node pose_timeout_s=1.0 → 1-2 Hz'de odom yayını KESİLİR
  # (F-M.6 defter kaydı). 5 Hz'in altına İNME.
  # Not: bu istek yalnız MAVROS'un kanalını (USB/SERIAL0) etkiler; 868 MHz
  # telemetri radyosu ayrı porttur (SR1/SR2) — QGC hattına yük BİNMEZ.
  # Boot provasında ÖLÇÜLECEK: topic hz + tegrastats CPU + stamp jitter.
  stream_rate_hz: 10
  # F-P.14 (robustness taraması, 2026-07-15): RC kill/manuel-override
  # kanal/eşikleri öncesinde YALNIZ mavros_bridge_node.py'de hardcoded
  # varsayılandı — buraya (ve hardware.launch CLI'sine) hiç bağlanmamıştı.
  # RC alıcısının kanal kablolaması yarışma günü değişirse kod
  # değiştirip yeniden derlemek gerekirdi. Kod varsayılanlarıyla AYNI:
  # kill=kanal 8 (0-indeksli 7), PWM<1500 → KILL; manuel=kanal 5
  # (0-indeksli 4), PWM>1700 → manuel override.
  # 🔑 2026-08-11 YARIŞMA TABANI: ikisi de **-1 = KAPALI**. Gerekçe iki katlı:
  #   (a) Yarışmada kumanda kullanılmayacak (kaptan kararı 04.08, §0.4a①) —
  #       alıcı yokken kanal boşta okunur ve §0.12/1'de FSM elle launch'ta
  #       ANINDA KILL'e düştü (kanal 8 = 1000 < 1500).
  #   (b) F-S.12: `-1` ile "kapalı" YOLU da bir kez KILL basıyordu
  #       (`len(ch) > -1` hep True, `channels[-1]` = SON kanal) — düzeltildi,
  #       3 nöbetçi test bekliyor.
  # Donanım durdurma yolları etkilenmez: mod anahtarı → Manual · RC10_OPTION=31
  # MotorEStop · Mission Planner HOLD (§0.32/E).
  # Masa/bench'te RC ile çalışılacaksa: video.yaml overlay'i 7/4 veriyor.
  rc_kill_channel: -1
  rc_kill_threshold_pwm: 1500
  rc_manual_channel: -1
  rc_manual_threshold_pwm: 1700
  # F-S.13 (13.08.2026, §0.60) — OPERATÖR MOD ÖNCELİĞİ.
  # Kaptan Mission Planner'dan MANUAL seçtiğinde auto-GUIDED ~20 ms içinde
  # geri alıyordu: 13.08 koşumunda 17 deneme, 17'si de geri çevrildi, tekneyi
  # ancak kumandanın MotorEStop'u durdurdu (bant session_20260813_041323).
  # true = hedef moddan ÇIKIŞ operatör niyeti sayılır, yazılım geri zorlamaz;
  # otonomi ancak operatör yeniden GUIDED seçince döner.
  # ⚠️ Bunun bedeli: uçuş kontrolcüsü KENDİ failsafe'iyle GUIDED'dan düşerse
  # de yazılım geri almaz — moda geri almak operatörün işidir.
  operator_mode_override: true

# --- B2: Ekran-2 kaynağı (md 3.3.1.1) ---
# AUTO'da MPPI cmd_vel basmaz → grafikte MPPI thrust'ını göstermek YANILTICI.
# Gerçek kuvvet isteği FC'nin servo çıkışıdır (/mavros/rc/out PWM → ±%100).
telemetry:
  setpoint_source: "girdap"      # yarışma tabanı: MPPI'nin kendi isteği
                                 # (video: "fc" — AUTO'da MPPI cmd_vel basmaz,
                                 #  gerçek kuvvet isteği FC servo çıkışıdır)
  # ⚠ FC'nin WP_SPEED parametresiyle SENKRON OLMALI — çekimden önce teyit et.
  fc_cruise_setpoint_mps: 1.0
  # 🔴 2026-08-11 DÜZELTİLDİ — eskiden `left_ch: 1` / `right_ch: 3` idi ve
  # yorumu "SERVO1 = sol motor (masa teyidi)" diyordu. **TERSİ ölçüldü.**
  #
  # Kanıt zinciri (07.08, hepsi FİZİKSEL, parametre okuması değil):
  #   · §0.12c açı taraması — 80°/95° koşumlarında güçlü basan servo yer
  #     değiştiriyor; kaptan 80°'de SAĞ motorun daha çok döndüğünü GÖZLEDİ
  #   · `34ade34` diferansiyel dönüş — SOLA: ch1out=2000 / ch3out=1000
  #     (skid-steer'de sola dönmek için SAĞ motor hızlanır) → ch1 = SAĞ
  #   · §0.13 A/B/C geri-gidiş testi tablosu: "SERVO1 (sağ) · SERVO3 (sol)"
  #   · Fonksiyon numaralarıyla da tutarlı: SERVO1_FUNCTION=74=ThrottleRight,
  #     SERVO3_FUNCTION=73=ThrottleLeft (10.08 uçuş kontrolcüsü dökümü)
  #
  # 🔑 Bu, projenin BİR KEZ DÜZELTİP KODA YANSITMADIĞI hata: 07.08 günlüğünde
  # *"`SERVO1`'i sol sandım (74 = ThrottleRight = sağ)"* diye kayıtlı, ama bu
  # satır o gün güncellenmemiş.
  #
  # Etkisi: yalnız `setpoint_source: "fc"` kolunda (telemetry_node.py:263 else
  # dalı — `/mavros/rc/out` aboneliği). Yarışma tabanı "girdap" olduğu için bu
  # değerler BUGÜN OKUNMUYOR; `video.yaml` overlay'inde okunuyor. Ters kaldığı
  # sürece Dosya-2 CSV'sinde ve Ekran-2c grafiğinde sol/sağ itki SÜTUNLARI
  # yer değiştirir (md 4.2 / md 3.3.1.1) — sessiz, çünkü değerler makul görünür.
  #
  # ⚠ KALAN BELİRSİZLİK: fonksiyon ataması parametreden okunur, ama o çıkışın
  # FİZİKSEL olarak hangi motora gittiği okunamaz. §0.30b Motor Test'i
  # (C=ThrottleLeft → sol motor dönmeli) suya girmeden yine de koşulacak;
  # sonuç tersse burası ve `planning`/`fsm` tarafı BİRLİKTE gözden geçirilir.
  fc_thrust_left_ch: 3           # SERVO3 = ThrottleLeft = SOL motor
  fc_thrust_right_ch: 1          # SERVO1 = ThrottleRight = SAĞ motor

# --- planning_node mod geçidi + MPPI saha tuning ---
# planning cmd_vel'i yalnız bu modda yayınlar; kök mode_name ile AYNI olmalı.
# Değer verilmezse hardware.launch kök mode_name'i miras aktarır (drift önlenir).
planning:
  mode_name: "GUIDED"
  # MPPI tuning — göl/saha gününde YENİDEN DERLEMEDEN değiştirilebilir.
  # hardware.launch bunları launch-arg olarak da açar:
  #   ros2 launch girdap_decision hardware.launch.py planning.mppi_lambda:=50.0
  # Buradan silinen anahtarda kod varsayılanı (λ'da parkur profili) kazanır.
  # Ölçüm tabloları ve üst sınırlar: CLAUDE.md MPPI bölümleri.
  mppi_lambda: 0.0                 # 0 = parkur profili kazansın (P1/P2=1, P3=10)
  mppi_sigma_u: 0.364              # N, σ = 0.25·max_thrust (06.08 ölçümü)
  mppi_obstacle_margin: 1.0        # m, SOFT emniyet payı
                                   # ⚠ BÜYÜTME: 1.2'de model gelmeyen kol
                                   # kırılıyor (2/4 nokta). Kapı direği payı
                                   # için gate_post_margin_m.
  mppi_terminal_mode: "lookahead"  # lookahead | global (eski davranış)
  # 🔴 15.0 → 3.0 (08.08): kural `lookahead ≥ hız × ufuk`; gerçek tekne
  # 1,05 m/s × 2,5 s = 2,62 m. Eski 15, itkisi 30 N sanılan tekneye aitti.
  # P1 kapalı-döngü: la=15 → 0/2 tohum bitiremedi, la=3 → 3/3 bitti.
  mppi_terminal_lookahead_m: 3.0   # m, terminal hedef yay uzaklığı
  mppi_ref_window_size: 100        # nokta, kayan referans penceresi
  mppi_ref_window_enabled: true    # false → tam tarama (16× yavaş, A/B için)
  # 🔴 F-F.22 İLERİ TERCİHİ — 17.08 göl ölçümü: komutların %23,1'i GERİ,
  # %83,4'ünde hedef ARKADA. İkisi de KAPALI = eski davranış birebir.
  mppi_ileri_kisit: false     # SERT kısıt (Nav2 vx_min=0 karşılığı) — GARANTİ
  mppi_w_ileri: 0.0           # YUMUŞAK terim (PreferForwardCritic) — garanti yok

  # 🔴 F-F.27/F-F.28 — RRT* GERİ DÜŞÜŞÜ. 17.08 göl bandı GÜNCEL KODLA
  # koşturuldu (`scripts/bant_kosum.sh`, 180 s, izole domain 88):
  #                             taban    kurtarma 3,0 m
  #   goal engel/sınır içinde     322          10     (−%97)
  #   düz çizgi geri düşüşü        43           7     (−%84)
  # ⚠ Bütçe 6,0 m DENENDİ, DAHA KÖTÜ (7 → 12). 3,0 ölçülmüş değerdir.
  # ⚠ SİM YANILTMIŞTI: sanal gölde başarısızlıkların 11/12'si "çözüm
  #   bulamadı" görünüyordu; gerçek veride tam tersi. Karar GERÇEK BANTLA.
  rrt_hedef_kurtarma_m: 3.0   # ✅ AÇIK
  # 🔴 19.08: ikisi de ayar sinifinda VARDI ama hicbir parametreye bagli
  # DEGILDI — olculmus kollar sahada denenemiyordu (04bddb7 tuzagi).
  stuck_recovery_enabled: true    # F-P.11. false = 18.08 oncesi davranis (ACIL KAPATMA)
  # 🔴 19.08: launch beyaz listesinde VARDI ama iki yaml'da da YOKTU —
  # yani olculmus A/B adayi ayardan verilemiyordu (04bddb7'nin ILK vakasi).
  # Unutma menzili = harita yaricapi (25 m) x bu katsayi.
  # OLCULDU: 1,0 torbayi ~%30 kucultuyor, kurtarilan kaydi yalniz %0,9
  # azaltiyor. 16.08 bandinda 2,0 ile 'unutulan' 600 s'de 38'de DONDU.
  # ⚠ 2,0 = mevcut davranis; degistirmeden once kapali dongu A/B.
  edge_unutma_katsayisi: 2.0
  mppi_geri_hiz_yasak: false      # geri surusu HIZ uzayinda eler, FREN SERBEST.
                                  # mppi_ileri_kisit'ten farki: o itki uzayinda
                                  # calisip freni de yasakliyor (durus yolu 2,4x).
                                  # HIC DENENMEDI — olculmeden acilmaz.
  rrt_kismi_plan_min_m: 0.0   # ⛔ KAPALI — aynı bantta yardımcı olmadı (7 → 14)

  # 🔴 F-F.23/F-F.24 — pivot kapısının iki kör noktası. İKİSİ DE KAPALI:
  # tek başlarına HİÇ ölçülmediler. 1,57 m = 2 × gövde (0,785) = LOS
  # literatürünün "circle of acceptance" değeri.
  pivot_yakin_esik_m: 0.50    # ⛔ eski davranış (ölçülen aday: 1.57)
  pivot_yedek_referans: false # ⛔ eski davranış
  # --- Kapı takibi (2026-08-03) — md 5.5.2.2, puan kapıdan geçmekten gelir.
  # 🔑 AYARLANABİLİR EŞİK YOK. Kapı geometrisi önceden bilinemez (şartname:
  # mesafeler yarışma alanına göre değişir + dubalar deniz şartlarıyla yer
  # değiştirir), dolayısıyla "sahada ölçüp gir" diye bir sayı OLAMAZ.
  # Geriye kalan iki değer ÖLÇÜLMÜŞ TEKNE BOYUTUDUR — tekne değişirse
  # güncellenir, sahada deneyerek ayarlanmaz.
  # Türetilenler (kod içinde, ayar değil): geçilebilirlik = gövde genişliği ·
  # burun hattı = gövde boyu/2 · kapı ayrımı = |Δileri|<|Δyanal| (45° geometrik
  # sınır) · kapı geçildi = ileri mesafe ≤ 0 · aynı kapı = kapı genişliği/2.
  gate_following_enabled: true     # false → ham görev noktasına git (eski davranış)
  edge_buoy_class_id: 0            # turuncu KENAR dubası → engel DEĞİL, kapı
  use_classified_obstacles: true   # sınıflı topic aktığında obstacle_map'i ezer
  hull_width_m: 0.785              # ÖLÇÜLDÜ 09.08 (78,5 cm — şeritle, duba
                                   # yüksekliği bandında; eskiden 0.78 idi ve
                                   # kaynağı belirsizdi) — bundan dar
                                   # açıklıktan tekne geçemez → kapı sayılmaz
  hull_length_m: 1.04              # ÖLÇÜLMÜŞ — yarısı burun hattı
  # B2 HUNİ (09.08): kapı direği artık ENGEL de kalıyor, payı ölçülen
  # açıklıktan türüyor (dar kapıda kendiliğinden küçülür, geçidi kapatmaz).
  # Bu satır o payın TAVANI. Ölçüm: 1.0 → gövde payı −0,006 m (TEMAS) ·
  # 1.4 → +0,306 · 1.8 → +0,582 AMA son noktaya varılamıyor (3/4; nokta
  # kapı direğine 2,0 m uzakta, halka varış yarıçapını yiyor).
  gate_post_margin_m: 1.4          # m, kapı direği ceza payı ÜST sınırı

# --- Görev dosyası seçimi (Sprint 4 parkur katmanı) ---
# hardware.launch bu dosya adını config/ altında çözer ve HEM mission_manager
# HEM fsm_node'a geçer (aynı waypoint dizisi → parkur index'leri hizalı).
#   video_mission.yaml       → 4-nokta dikdörtgen, tek parkur (Otonomi videosu)
#   competition_mission.yaml → Parkur-1/2/3 etiketli waypoint dizisi (yarışma)
mission:
  mission_file: "competition_mission.yaml"
  # Görev KAYNAĞI (T0-f):
  #   "file" → araç üstü mission_file YAML (offline/geliştirme).
  #   "fc"   → YKİ→Pixhawk→MAVROS /mavros/mission/waypoints. Şartname
  #            md 3.3.1(2) + md 5.5.2.2: görev YKİ'de tanımlanıp İDA'ya
  #            YÜKLENİR → VİDEO ve YARIŞMA günü ZORUNLU mod.
  # Sahada: QGC'den görevi Pixhawk'a yükle. VİDEO ve YARIŞMA = "fc" (md 3.3.1(2)
  # görev YKİ'de tanımlanıp İDA'ya YÜKLENİR). girdap-karar.service zaten
  # mission_source:=fc geçiyor; varsayılanı da "fc" tutuyoruz ki ELLE launch
  # edildiğinde sessizce araç-üstü YAML'a düşülmesin (video şartını ihlal eder).
  # Offline/geliştirme için: mission_source:=file ver.
  mission_source: "fc"
  skip_home_seq0: true    # fc: ArduPilot görev index 0 = home konumu, atla
  # --- Parkur-3 hedef rengi (12'lik madde #4, şartname md 5.5.3.1) ---
  # Hakem hedef duba rengini koşudan ÖNCE söyler. Bu renge ait tespitler
  # `class_id=2` (hedef) olarak yeniden etiketlenir; aşağı akıştaki hiçbir şey
  # değişmez (MPPI `w_kamikaze` çekicisi ve FSM Parkur-3 mantığı hep 2'ye bakar).
  #
  # BOŞ BIRAK — varsayılan hâl hareketsizdir, hakem konuşmadan hiçbir şey
  # yeniden etiketlenmez. Değeri config'e YAZMA; koşu sabahı canlı ver:
  #     ros2 param set /perception_camera_node kamikaze_target_color kirmizi
  #
  # Kabul edilenler: kirmizi/kırmızı/red · yesil/yeşil/green ·
  #                  siyah/black   (18.08: kahverengi KALDIRILDI — sartname
  #                  s.18 hedef renkleri RAL 3026/6037/**9005 siyah**;
  #                  kahverengi hicbir maddede gecmiyor ve asagi akista
  #                  RENK_KOD'a cevrilemiyordu = olu yoldu)
  # 🔴 turuncu ve sarı REDDEDİLİR (kod düzeyinde): turuncu = parkur KENAR
  #    dubası — `gate_follower` kapıları tam o sınıftan buluyor, hedefe
  #    taşınırsa kapılar görünmez olur VE tekne kapı dubalarına sürer;
  #    sarı = ENGEL, engele nişan almak istemiyoruz.
  # 🔴 md 5.5.3.1: HAREKET BAŞLADIKTAN SONRA DEĞİŞTİRİLEMEZ. Kod bunu
  #    zorluyor — FSM `PARKUR1/2/3` durumundayken `ros2 param set` reddedilir.
  #    Yeniden vermek gerekirse önce `/girdap/mission/reset` (madde #11).
  # 🔴 11.08 UYARISI — BU PARAMETRE TEK BASINA YETMEZ: YOLO yesil/kirmizi/
  # siyah icin EGITILMEDI. Yani akista class_id 3/4/5 HIC YOKSA burada
  # renk vermek hicbir seyi hedefe tasimaz (sessizce 0 tespit). Cozum yeniden
  # egitim DEGIL: camera_buoys.py'deki BuoyLocalizer + classify_roi_color()
  # deseni (YOLO sinifsiz duba bulur, rengi bbox ici HSV karar verir).
  # Ayrica o uc HSV esigi sahada HIC dogrulanmadi. Bkz. 12'lik madde #4.
  kamikaze_target_color: ""
  # F-V.7 (AUTO video): FC waypoint'te DURMAZ — bizim dwell'imiz yalnız kendi
  # hedef index'imizi geciktirir → yon_setpoint 2 sn boyunca ARKADA kalan
  # waypoint'i gösterir (Ekran-2b yalan söyler). AUTO'da dwell = 0.
  # ⚠ YARIŞMA (GUIDED+MPPI, tekneyi BİZ sürüyoruz): 2.0 — gerçek bekleme.
  dwell_time_s: 2.0
  # FC'nin WP_RADIUS'u ile AYNI olmalı (ArduRover varsayılanı 2 m).
  # ⚠ FC ekibinden TEYİT AL — farklıysa hedef index'imiz FC'den ayrışır.
  # ⚠ NOT (§1.68): ArduRover **4.3+** `WP_RADIUS`'u AUTO'da artık DİKKATE
  #   ALMIYOR (ArduPilot #23457); tamamlama ölçütü "hedefi GEÇTİ mi". Bizde
  #   koşan sürüm **V4.6.3** ⇒ bu eşleştirme kuralı bugün fiilen geçersiz.
  arrival_radius_m: 2.0
  # 🔑 §1.68 — VARIŞ ÖLÇÜTÜ: "yaklaştım" mı, "GEÇTİM" mi.
  # Şartname kapı geçişini *"İDA'nın duba ikilisinin %100'ünü geçmiş olması"*
  # diye tanımlıyor; algı da bunu düzlem aşmayla sayıyor
  # (duba_gecis_navigator.PASS_EK_YOL = ARAC_BOY 1,03 + 0,5 = 1,53 m).
  # Varış yarıçapı ise araca kapıya 2,0 m KALA "vardın" diyor ⇒ ikisi
  # buluşmuyor, açık = 3,53 m. AÇILINCA varış ayrıca düzlem aşmayı da ister.
  # ⚠ false = ESKİ DAVRANIŞ BİREBİR. Bantta A/B ölçülmeden AÇILMAZ.
  gecis_zorunlu: true
  # Kilitlenme yedeği (s): yarıçapın içinde bu kadar kalıp düzlem aşılamazsa
  # varış yine kabul edilir + sayaç artar. 0 = yedek yok (takılma serbest).
  gecis_zaman_asimi_s: 5.0
  gecis_payi_m: 0.0       # mekanizma HAZIR ama KAPALI: fly-by gercek kosumda
                          # duzlemi +5,98 m astirdi (esik 1,53) ⇒ siki esige GEREK YOK.
                          # 1,53'e cekmek OLCULMEDI; gerekirse tek satir.
  # 19.08.2026 — daha önce burada YOKTU (§1.60b: alan var, yüzeye bağlı
  # değil — hardware.yaml'da değiştirmek sessizce etkisizdi). Referans
  # seyir hızı (MPPI hedef hızı); şu an params.yaml'daki (1.0) ile AYNI —
  # bu satır saf tellemektir, davranış değişmedi.
  # ⚠ AÇIK KARAR: kaptanın göl bandından ölçtüğü gerçek seyir 0,62 m/s,
  # burada 1.0 — henüz uzlaştırılmadı, sahada gerçek kapı geçme
  # performansıyla doğrulanmalı (bkz. CLAUDE.md "MPPI Terminal Maliyeti").
  cruise_velocity_mps: 1.0

# --- iSAM2 sensör füzyonu (fusion_node) ---
# ⚠ Bu blok `perception.fusion` (kamera-LiDAR bearing eşleştirmesi) ile
# KARIŞTIRILMAMALI — burası GPS/IMU factor-graph smoother'ıdır.
# hardware.launch launch-arg olarak açar: fusion.keyframe_rate_hz:=10.0 vb.
fusion:
  # Key üretim tavanı. ÖLÇÜM (2026-08-01, IMU 50 Hz + GPS 1 Hz, 20 dk):
  #   throttle kapalı (eski) : 11 416 key,  17.8 s toplam füzyon CPU
  #   throttle 5 Hz          :  6 000 key,   4.0 s  (4.5x daha ucuz)
  # Graf ve her calculateEstimate() key sayısıyla doğru orantılı büyür
  # (CLAUDE.md "iSAM2 graf büyümesi" tuzağı). Ara IMU adımları tek
  # BetweenFactor'da biriktiği için BİLGİ KAYBI YOK — aynı senaryoda iki
  # ayarın ürettiği poz 1 cm'den az farkeder. 0 → throttle kapalı.
  keyframe_rate_hz: 5.0
  # 🌱 §1.56g — dönemsel yeniden çıpalama (graf sınırlama). Gerçek bantta
  # (session_20260817_180538, 80 dk) update sürüklenmesi 25,0× → 1,14×,
  # ATE 0,060 → 0,063 m (değişmedi), RPE 1 s 0,027 m (aynı). 0 = kapalı.
  reanchor_period_s: 30.0
  # Korunan kuyruk — periyottan KÜÇÜK olmak zorunda, yoksa graf budanmaz.
  reanchor_keep_s: 6.0
  # 🔴 19.08 (§1.68e-②): capa prior'u AYARDAN verilemiyordu — None →
  # prior_sigma_xy = 0,05 m SABIT. Yani capa, GPS kalitesinden BAGIMSIZ
  # olarak '5 cm dogrulukla buradayim' diyordu. OLCULDU: elimizdeki
  # bantlarin HICBIRINDE RTK yok (fix 0), sigma ~0,25-0,34 m = iddianin
  # 5-7 KATI. Cipalama canli ve 30 s'de bir; o anki hatayi kilitleyebilir.
  # 0.0 = ESKI DAVRANIS BIREBIR. Olculmeden degistirilmez.
  reanchor_sigma_xy: 0.0
  # Kardeşi (xy) 19.08'de bağlandı ama BU alan atlanmıştı — aynı gerekçe,
  # heading kalitesi için. 0.0 = ESKİ DAVRANIŞ BİREBİR.
  reanchor_sigma_psi: 0.0
  # GPS outlier reddi — Huber M-estimator. Tek kötü fix (multipath, RTK
  # kaybı) saf Gauss modelinde TÜM çözümü kendine çeker.
  gps_robust_enabled: true
  gps_huber_k: 1.345              # σ katı (literatür standardı)
  # Fix kalitesine göre ölçüm sigma'sı [m] — NavSatFix.status.status.
  # ⚠ SAHADA DOĞRULANMADI: RTK base kurulumu ve gerçek çoklu-yol ortamında
  # ölçülecek ilk tahminler. STATUS_NO_FIX (-1) → ölçüm HİÇ kullanılmaz.
  gps_sigma_by_status:
    gbas_fix: 0.05                # RTK fixed (Holybro H-RTK F9P)
    sbas_fix: 0.50                # SBAS düzeltmeli
    fix: 2.50                     # tek nokta (autonomous)

# --- Perception: LiDAR engel tespiti (Sprint 1) ---
# perception_lidar_node parametreleri; hardware.launch launch-arg olarak açar
# (CLI override: perception.lidar.z_min:=0.2 vb.). Saha kalibrasyonunda tune.
perception:
  lidar:
    # 🔑 B0/F5.1 (06.08): z_min/z_max **base_link** çerçevesindedir. Node ham
    # bulutu önce base_link'e taşır; taşıma miktarı BU BLOKTAN DEĞİL aşağıdaki
    # `tf.livox_frame` bloğundan gelir (static TF yayıncısıyla tek kaynak).
    # Buraya `mount_*` yazma — launch onu `tf:`ten geçiriyor ve EZER.
    z_min: 0.1              # base_link'e göre su üstü kesim (m)
    z_max: 3.0              # yüksek yansımaları at (m)
    cluster_tolerance: 0.5  # aynı cluster'da olma mesafesi (m)
    min_cluster_size: 5     # bu altı noise
    max_cluster_size: 500   # bu üstü tek engel değil büyük yapı → bölünür (F5.4)
    split_cell_m: 1.0       # büyük küme bölme ızgarası XY hücre kenarı (m)
    # 🔴 F-P.30 — YAYILIMA GÖRE BÖLME. 0.0 = ESKİ DAVRANIŞ BİREBİR.
    # 17.08 göl bandı: engel torbasının %98,6'sı CLASS_UNKNOWN, yarıçap
    # ortanca 0,56 m MAKS 17,2 m (duba 0,15 m olmalı). Kıyı bir DOĞRU
    # parçası; onu çevrel daireyle temsil etmek yüzlerce m² boş suyu "dolu"
    # ilan ediyor. `split_cell_m` bölmesi bunu kaçırıyordu çünkü tetiği
    # NOKTA SAYISI (>500); uzak/seyrek kıyı az noktayla 17 m'ye yayılıyor.
    # Ölçüldü (kıyı doğrusu + 2 duba): kapsanan alan 707,0 → 9,6 m² (73×),
    # ölçülen nokta örtüşmesi %100 → HİÇBİR gerçek engel kaybolmuyor.
    # ⚠ Bandın gerçek koşumunda `goal engel/sınır içinde` hatası 322 kez
    # ateşledi; bu şişme onun en güçlü adayı.
    # ✅ AÇILDI 18.08 — ölçüm gerekçesi yukarıda. Kapsanan alan 707 → 9,6 m²,
    # ölçülen nokta örtüşmesi %100 (hiçbir gerçek engel kaybolmuyor).
    # ⚠ Gerçek LiDAR bulutuyla uçtan uca DOĞRULANMADI (ham bulut banda
    # kaydedilmiyor — bilerek, 14 GB/8-12 sn donma). Gölde 2 dk'lık
    # `rosbag_kaydet.sh --lidar` çekimiyle doğrulanacak.
    split_max_yaricap_m: 2.0
    max_range: 25.0         # yatay menzil filtresi (m)
    voxel_size: 0.1         # m, clustering öncesi downsample (F5.3; 0=kapalı)
    log_period_s: 5.0       # "K engel" INFO log periyodu
    # 🔑 F-L.3 (11.08, Jetson'da GERÇEK donanımla ölçüldü) — PAKET BİRLEŞTİRME.
    # livox_ros_driver2 bu sürümde `publish_freq`'i mesaj birleştirmede
    # KULLANMIYOR (`Lddc::publish_period_ns_` ölü kod; her ethernet paketi ayrı
    # ROS mesajı olarak yayınlanıyor). Ölçüm: /livox/lidar ~475 Hz, width=96 —
    # publish_freq=10.0 olmasına rağmen. Kümeleme mesaj başına koştuğu için
    # 30 cm'lik duba tek pakette min_cluster_size'ı toplayamaz → obstacle_map
    # "akar" ama İÇİ BOŞTUR. Birleştirme bu yüzden BİZİM tarafta yapılır.
    # 0 = kapalı (eski davranış birebir). ⚠ Büyütmek iz yayılmasını da büyütür
    # (1 m/s × 0,1 s = 10 cm; duba çapı 30 cm) — 0,1 bilinçli üst sınır.
    # ⚠ 11.08.2026 (öğleden sonra) — 0.1'DEN 0.0'A ÇEKİLDİ.
    # Yama 96-nokta paket arızası için yazılmıştı; sürücü yeniden başlatılınca
    # /livox/lidar ÖLÇÜLDÜ: 10 Hz × ~20 000 nokta, yani zaten doğru kare.
    # Birleştirme açıkken 2-3 tam kare üst üste bindi → 40-60 bin nokta,
    # kümeleme 172-300 ms (bütçe 100 ms), obstacle_map 10 Hz yerine 2,2 Hz.
    # Kazanç yok, bedel kesin. 96-nokta hali geri gelirse tek sayıyla açılır.
    birlestirme_s: 0.0      # s, kümeleme öncesi paket biriktirme penceresi (0 = kapalı)
  # Kamera duba tespiti (Sprint 2) — HSV aralıkları dizi olduğundan yalnız
  # params.yaml'da; buradakiler launch-arg olarak açılır (skaler ayarlar).
  camera:
    clahe_clip_limit: 2.0   # su parlaması kontrast dengesi
    clahe_tile: 8           # CLAHE karo ızgarası
    min_area_px: 150        # bu altı kontur noise
    morph_kernel_px: 5      # maske açma/kapama çekirdeği
    use_yolo: false         # hedef sınıfı YOLO katmanı (Parkur-3)
    yolo_model_path: ""     # gerçek .pt yolu (boş = mock inference)
    log_period_s: 5.0
  # Kamera-LiDAR bearing füzyonu (Sprint 3) — kalibrasyon YOK, bkz.
  # prototype/perception/fusion.py docstring (İŞARET KURALI uyarısı).
  fusion:
    bearing_tolerance_rad: 0.15    # ~8.6° eşleşme kabul eşiği
    camera_hfov_rad: 1.2           # OAK-D Lite yatay FOV yaklaşık değeri
    # 2026-07-17: oakd_driver_node 1280x720'e çıkarıldı (640x480'de sahada
    # 2m'deki duba bile net görülemiyordu) — GERÇEK GÖRÜNTÜ BOYUTUYLA
    # eşleşmeli, yoksa bearing hesaplaması yanlış çıkar.
    camera_image_width_px: 1280    # /perception/buoys bbox normalizasyonu
    camera_image_height_px: 720
    sync_slop_s: 0.1                # ApproximateTimeSynchronizer toleransı
    # Eşleşme hiç olmuyorsa ÖNCE burayı büyüt, slop'u değil (tezgah 09.07:
    # damgalar aynı tabanda ~27 ms, arıza clustering gecikmesi; 10 ve 50
    # yetmedi, 100 tuttu). Kuyruk = kamera Hz × gecikme sn.
    sync_queue_size: 100            # sync geçmiş derinliği (LiDAR gecikme marjı)
    log_period_s: 5.0
    # 🔴 KAPTAN KARARI 18.08.2026 — "bilinmeyen engelleri füzyona sokma".
    # false → eşleşmeyen (sınıfsız) LiDAR kümesi çıkışa GİRMEZ.
    # ⚠️ EMNİYET BEDELİ: kameranın sınıflayamadığı GERÇEK engel de düşer
    #    (kamera 69°, LiDAR 360°). Varsayılan bilerek true = eski davranış;
    #    TEKNOFEST öncesi denetim listesinde gözden geçirilecek.
    bilinmeyen_engelleri_tut: true

# --- Sensör / perception topic isimleri ---
# gps + imu doğrudan mavros'tan gelir (karar yığını bunlara abone).
# livox + oak_* sensör sürücüleri BAŞKA arkadaşta; burada referans/remapping
# amaçlı listelenir (perception cost map + Dosya 1a/1b üretimi).
topics:
  livox:     /livox/lidar
  oak_rgb:   /oak/rgb/image_raw
  oak_depth: /oak/stereo/depth
  gps:       /mavros/global_position/global
  imu:       /mavros/imu/data

# --- Sensör montaj offset'leri (static TF) ---
# ⚠️ HEPSİ 0 = KALİBRE EDİLMEMİŞ. Gerçek değerler `docs/olcum_formu.md`
# §2 (LiDAR) ve §3 (kamera) doldurulunca buraya girilecek.
# Eksen kuralı (REP-103): +x pruva, +y iskele, +z yukarı.
# ⚠️ AÇILAR RADYAN (static_transform_publisher radyan bekler; form derece
#    topluyor → rad = derece * pi / 180).
# 🔴 livox_frame.z (= mekanik "h") F5.1'i çözen sayıdır: perception_lidar_node
#    şu an TF dönüşümü UYGULAMIYOR, z_min=0.1 filtresi ham LiDAR çerçevesinde
#    çalışıyor. LiDAR base_link'in üstündeyse dubalar negatif z'de kalıp
#    tamamen elenebilir — ölçüm gelince perception ekibine bildirilecek.
# ✅ ÖLÇÜLDÜ 2026-08-04, kullanıcıyla birlikte (docs/olcum_formu.md §2).
#
# base_link = TEKNENİN GEOMETRİK MERKEZİ (Pixhawk DEĞİL — 2026-08-04'te
# değiştirildi). Tanım:
#   x: gövde boy ortası      → ön uçtan 51.5 cm (tekne boyu 103 cm ölçüldü;
#                              koddaki hull_length_m=1.04 böylece doğrulandı)
#   y: gövde merkez hattı    → LiDAR zaten tam orada
#   z: gövde tabanı          → tekne masadayken masa yüzeyi
#
# Ham ölçümler (metre 0'ı ön uçta, tekne masada):
#   tekne boyu 103.0 · LiDAR ön uçtan 50.0 · LiDAR masadan 41.0
#   kapak ağzı masadan 24.5 · kapak ağzı tekne tabanından 15.0
#   Pixhawk tabandan 6.0 (3D baskı platform) → Pixhawk masadan 15.5
#   Pixhawk, LiDAR'dan 7 cm KIÇA ve 13.75 cm İSKELEYE kayık
#
# ✅ ODOM İLE HİZALANDI — 2026-08-10 (`d431da7`). Bu blok base_link'i gövde
#    merkezine koyuyor; ArduPilot'a da sensörlerin nerede olduğu SÖYLENDİ:
#      INS_POS1_X/Y/Z = -0.055 / -0.1375 / -0.155   (Pixhawk)
#      GPS1_POS_X/Y/Z = -0.035 / -0.16   / -0.365   (F9P anteni)
#    (ArduPilot ekseninde Y sancak+, Z aşağı+ olduğu için iskele/yukarı
#     bileşenler NEGATİF yazılır.)
#    Öncesinde bu altı parametre SIFIRDI, dolayısıyla
#    /mavros/local_position/odom pratikte GPS ANTENİNİN konumunu veriyordu ve
#    base_link tanımıyla çakışmıyordu — sistemde bilinen sabit bir ofset vardı.
#    ⏳ Kalan doğrulama: ArduPilot'un ofseti FİİLEN uyguladığı masa/su
#       testinde gözle görülmeden "tamam" denmeyecek.
#    Bkz. docs/sensor_konumlari_base_link.md · olcum_formu.md §0.
tf:
  # LiDAR: enine tam merkezde, boyuna ortadan 1.5 cm pruvada.
  # ⏳ yaw: ampirik kalibre edilecek (olcum_formu §0.5 — merkez hattına 10 m
  #    ileriye hedef koy, /perception/obstacle_map'te position.y ≈ 0 olmalı).
  livox_frame: {x: 0.015, y: 0.0, z: 0.41, yaw: 0.0, pitch: 0.0, roll: 0.0}
  # Kamera TAKILDI ve ötelemeler ÖLÇÜLDÜ (09.08). Referans = ortadaki RGB
  # lensin merkezi; lens açıkta, muhafaza yok. Ölçüm: ön uçlara dayanan dikey
  # levhadan lens hizasında yatay 33 cm (→ x), lensten sol/sağ dışa 39.5/39.0
  # (→ y≈0, toplamı 78.5 = ölçülen gövde genişliği, çapraz teyit), masadan
  # lens merkezine 28 cm (→ z). Ayrıntı: olcum_formu §3.
  # pitch = 0: AMPİRİK ölçüldü ±5° (gölde tekne suda, aynı kaidede çekilmiş
  #   dataset karelerinde ufuk kare ortasında: −5/+2 px → ∓0.4°). Mekanik
  #   teyit: kaide yere paralel vidalı. ⏳ Ham dosyalarla ±0.5°'ye indirilir.
  #   ⚠️ Montaj fotoğrafından "yukarı bakıyor" sanılmıştı — YANLIŞTI.
  #   🔴 pitch işareti: AŞAĞI bakıyorsa ARTI, YUKARI bakıyorsa EKSİ
  #   (REP-103; static_transform_publisher --pitch). olcum_formu §3 09.08'e
  #   kadar tersini yazıyordu, düzeltildi.
  # yaw = 0: mekanik (kaide düzgün vidalı). ⏳ Suda ampirik doğrulanacak —
  #   merkez hattına 10 m ileriye duba, görüntünün TAM ortasında olmalı.
  # 🔴 yaw ÖLÇÜLDÜ 2026-08-11: +0.0415 rad (+2.38°, İSKELEYE dönük).
  #    Yöntem: duba 5,20 m ileride, merkez hattının 15 cm SOLUNDA (şeritle).
  #      gerçek yön   = atan2(0.15, 5.20)            = +1.65°
  #      kamera dedi  = (0.5 − 653.5/1280) × 69°     = −0.73°
  #      fark = kamera yaw                            = +2.38°
  #    Aynalama kontrolü yapıldı (kişi gövdenin sağında → görüntünün sağında).
  #    Belirsizlik ~±0.6° (15 cm ölçümü ±3 cm + ana nokta ~±0.5°) → sinyal gerçek.
  #    ⚠️ DEĞER HENÜZ TÜKETİLMİYOR: `bearing_from_camera` yalnız
  #    (0.5 − bbox_cx) × hfov hesaplıyor, yaw terimi YOK. Buraya yazmak tek
  #    başına DAVRANIŞI DEĞİŞTİRMEZ — fusion.py'ye ofset eklenmeli.
  #    Etkisi: tolerans 8.6°'nin %28'i; kapı ayrımı 10 m'de 7.7° (hata %31),
  #    15 m'de 5.2° (hata %46) → uzakta yanlış duba eşleşmesi riski.
  oak_frame:   {x: 0.185, y: 0.0, z: 0.28, yaw: 0.0415, pitch: 0.0, roll: 0.0}
  # Pixhawk 6C (IMU): ortadan 5.5 cm kıçta, 13.75 cm iskelede, tabandan 15.5 cm.
  imu_link:    {x: -0.055, y: 0.1375, z: 0.155, yaw: 0.0, pitch: 0.0, roll: 0.0}
