# Girdap İDA — karar yığını ROS 2 parametreleri.
# Sahada saha kalibrasyon değerleriyle override edilecek; varsayılanlar
# Layer 0 prototip ölçümlerinden gelir.

fusion_node:
  ros__parameters:
    use_isam2: true          # yarışma: iSAM2. Video: hardware.yaml false override
    publish_rate_hz: 10.0    # odom yayını = smoother flush hızı (10 Hz); daha
                             # hızlı republish yeni bilgi taşımaz, gereksiz yük
    odom_period_s: 0.1       # IMU delta biriktirme adımı (keyframe ALT sınırı)
    gps_sigma_xy: 0.30       # m, mock için; saha RTK fix'te 0.05. Fix kalitesi
                             # bilinen ölçümlerde gps_sigma_*_fix bunu ezer.
    imu_sigma_xy: 0.05       # m, pre-integration adımı
    imu_sigma_psi: 0.01      # rad
    keyframe_rate_hz: 5.0    # key üretim tavanı — iSAM2 graf büyümesi kapısı.
                             # Ölçüm (20 dk, IMU 50 Hz): kapalı → 11 416 key /
                             # 17.8 s CPU; 5 Hz → 6 000 key / 4.0 s. Ara IMU
                             # adımları tek BetweenFactor'da birikir (bilgi
                             # kaybı yok), odom σ'sı √Δt ile ölçeklenir.
                             # 0 → kapalı (eski davranış).
    gps_robust_enabled: true # Huber M-estimator ile GPS outlier reddi
    gps_huber_k: 1.345       # σ katı; Gauss verimliliğinin %95'ini korur
    # Fix kalitesine göre GPS ölçüm sigma'sı (NavSatFix.status.status).
    # STATUS_NO_FIX (-1) → ölçüm smoother'a HİÇ verilmez.
    gps_sigma_gbas_fix: 0.05 # m, GBAS = RTK fixed (H-RTK F9P)
    gps_sigma_sbas_fix: 0.50 # m, SBAS düzeltmeli
    gps_sigma_fix: 2.50      # m, tek nokta (autonomous) — neredeyse etkisiz

mock_sensors:
  ros__parameters:
    imu_rate_hz: 50.0
    gps_rate_hz: 1.0
    vel_sigma: 0.05          # m/s
    omega_sigma: 0.005       # rad/s
    gps_sigma_xy: 0.30       # m
    seed: 0

planning_node:
  ros__parameters:
    control_rate_hz: 10.0    # CPU'da K=1000 rollout ~100 ms → 10 Hz (100 ms
                             # periyot) gerçekçi. 20 Hz senkron step'i tutamaz
                             # (executor birikir, cmd_vel gecikir/titrer → istemsiz
                             # hareket). CUDA portu gelince 50 Hz'e çıkılır (CLAUDE.md).
    bounds_x: [0.0, 200.0]   # m, yarışma alanı temsili
    bounds_y: [0.0, 200.0]
    replan_proximity: 2.0    # m, RRT* replan tetiği
    # F-P.9 (13.08.2026) — REPLAN FRENİ. RRT* planning_node'un TEK thread'inde
    # koşuyor; Jetson ölçümü: plan() 20 duba 331 ms, 100 engel 510 ms, en kötü
    # 1491 ms — kontrol bütçesi 100 ms. Aralık SABİT DEĞİL:
    #   aralık = min(bosluk_katsayisi × son_plan_süresi, max_interval_s)
    replan_bosluk_katsayisi: 3.0   # kör oran = 1/(1+k) → %25
    replan_max_interval_s: 1.9     # s, tazelik tavanı = 2,0 m ÷ 1,05 m/s
    mppi_K: 1000             # rollout sayısı (CLAUDE.md)
    mppi_T: 50               # horizon adımı (2.5 s @ dt=0.05)
    # --- MPPI saha tuning yüzeyi (2026-08-02) ---
    # Hepsi kod varsayılanıyla AYNI değerde; buradan değiştirmek yeniden
    # derleme gerektirmez. Ölçüm tabloları: CLAUDE.md MPPI bölümleri.
    mppi_lambda: 0.0         # softmax sıcaklığı. 0 = NÖBETÇİ: parkur profili
                             # kazanır (PARKUR1/2 = 1, PARKUR3 = 10). >0 verirsen
                             # profili EZER (üç parkurda da o değer kullanılır).
                             # 🔴 06.08 ÖLÇÜMÜ (GIRDAP_DURUM §0.8): eski 10/50
                             # değerleri 30 N/motor'luk hayali tekneye aitti.
                             # Gerçek aktüatörde (1.455 N) λ=10 bozucu altında
                             # 6/9 sahnede hedefe VARAMIYOR; P3'te λ=50 temas
                             # hızını 0.60 → 0.14 m/s'e düşürüyor (IMU şok
                             # eşiği ile görev sonu algılanmayabilir).
    mppi_sigma_u: 0.364      # N, kontrol gürültüsü σ (her thruster). 06.08
                             # ölçümü = 0.25·max_thrust. Çalışma bandı
                             # σ/T ∈ [0.15, 0.50]; ≤0.10 keşif yetersiz,
                             # ≥0.69 doygunluk (örnekler ±T'ye kırpılır ve
                             # gürültü 'rastgele tam gaz' olur — eski 5.0 buydu).
                             # ⚠ İtki değişirse ORANI koru, N'yi değil.
    mppi_obstacle_margin: 1.0  # m, engel emniyet payı (SOFT ceza yarıçapı).
                             # ⚠ BÜYÜTMEYİ DENEME — 09.08'de denendi, geri
                             # alındı: 1.4'te kapı takipli kol iyileşiyor ama
                             # MODEL GELMEYEN kol kırılıyor (ham güzergah
                             # noktasına sürüş 3,3/4 → 1/4 nokta; 1.2'de 2/4).
                             # Sebep: hakemin noktası dubaya ~2,2 m yakın
                             # olabiliyor, büyüyen halka aracı varış
                             # yarıçapına (2,0 m) sokmuyor.
                             # Kapı direği payı için: gate_post_margin_m.
    mppi_terminal_mode: "lookahead"   # "lookahead" | "global" (eski davranış).
                             # ⚠ "global"e dönersen parkur profillerindeki
                             # w_terminal=50 fazla gelir (köşe keser).
    mppi_terminal_lookahead_m: 3.0    # m, terminal hedefin çapadan yay uzaklığı.
                             # ≥ seyir_hızı × horizon (T·dt) olmalı.
                             # 🔴 15.0 → 3.0 (08.08): 15 m, itkisi 30 N sanılan
                             # HAYALİ tekneden kalmaydı (5,3 m/s × 2,5 s = 13,25).
                             # Gerçek tekne (log 58 tanılaması) 1,05 m/s →
                             # kural 1,05 × 2,5 = 2,62 m diyor; 15 m ufkun 5,8
                             # katıydı ve terminal terim örnekler arasında ayrım
                             # yapmayı bırakıyordu. P1 kapalı-döngü ölçümü:
                             # la=15 → 0/2 tohum parkuru bitiremedi;
                             # la=3 → 3/3 bitti, ort 4,0/6 kapı.
                             # (docs/parkur1_kontrol_listesi.md §4)
                             # ⚠ Eski notlar: 10 m'de fren etkisi / 40 m'de engel
                             # açıklığı bozulması ölçümleri de o hayali tekneye
                             # aitti — gerçek tekneyle yeniden ölçülmedi.
    mppi_ref_window_size: 100   # nokta, kayan referans penceresi ileri derinliği
                             # (0.5 m aralıkta 50 m ileri + 12.5 m geri).
    mppi_ref_window_enabled: true  # false → eski tam tarama (regresyon/A-B).
                             # Ölçüm: 736 → 58 ms/iter, d2 tensörü 16× küçük.
    # --- Kapı takibi (gate following, 2026-08-03) ---
    # Şartname md 5.5.2.2: Parkur-1/2 puanı GPS noktasına basmaktan DEĞİL,
    # karşılıklı KENAR dubası ikilisinin ARASINDAN geçmekten gelir; hakemin
    # verdiği nokta tam kapı ortasında olmayabilir. Çekirdek
    # prototype/mission/gate_follower.py; bu blok onun saha yüzeyi.
    # ⚠ Parkur ÖNCEDEN GÖRÜLEMEZ (önceden haritalama da yasak) → bu değerler
    # "ölçülüp girilecek kalibrasyon" DEĞİLDİR. Aşağıdaki genişlik notuna bak.
    gate_following_enabled: true   # false → ham görev noktasına gidilir (eski
                             # davranış). Kapı görünmüyorken zaten fallback
                             # çalışır, yani açık bırakmak risksiz.
    edge_buoy_class_id: 0    # turuncu KENAR dubası (camera_buoys.CLASS_PARKUR_KENARI).
                             # Bu sınıf engel torbasından ÇIKARILIR — arasından
                             # geçilecek nesne engel sayılırsa MPPI kapıya
                             # girmeyi pahalı bulur.
    use_classified_obstacles: true  # /perception/classified_obstacles aktığında
                             # sınıfsız /perception/obstacle_map'in yerine geçer.
                             # false → eski davranış (kapı dubaları engel kalır).
    # 🔑 AYARLANABİLİR EŞİK YOK — kapı geometrisi önceden bilinemez.
    # Şartname üç yerde söylüyor: "kenar dubaları arasındaki mesafeler yarışma
    # alanına göre değişkenlik gösterecektir" · "Dubalar arasındaki mesafeler
    # ... yarışma alanına göre belirlenecektir" · "kenar dubaları ve engeller
    # de deniz şartlarından dolayı yer değiştirebilir" (→ koşu SIRASINDA bile
    # sabit değil). Parkur önceden görülemez; önceden haritalama zaten yasak.
    # Dolayısıyla "sahada ölçüp gir" diye bir eşik OLAMAZ.
    #
    # Aşağıdaki iki değer ÖLÇÜLMÜŞ TEKNE BOYUTUDUR (GIRDAP_DURUM §1:
    # 0,78 × 1,04 × 0,52 m). Tekne değişirse güncellenir, sahada deneyerek
    # AYARLANMAZ.
    #
    # Kod içinde bunlardan ve saf geometriden türetilenler (hiçbiri ayar değil):
    #   geçilebilirlik  = gövde genişliği   (dar açıklıktan tekne geçemez)
    #   burun hattı     = gövde boyu / 2    (duba bunun önünde olmalı)
    #   kapı ayrımı     = |Δileri| < |Δyanal|  (45° = iki hâl arasındaki
    #                     geometrik sınır; ölçek-bağımsız, genişlik bilmez)
    #   kapı geçildi    = ileri mesafe ≤ 0  (kapı düzlemi arkada kaldı)
    #   aynı kapı mı    = kapının kendi genişliğinin yarısı (öz-ölçekli)
    hull_width_m: 0.785      # m, ÖLÇÜLDÜ 09.08 (şeritle, duba yüksekliği bandı)
    hull_length_m: 1.04      # m, ÖLÇÜLMÜŞ gövde boyu
    # --- B2 HUNİ (2026-08-09) — kapı direği artık ENGEL de kalıyor ---
    # Direkler çarpışma korumasından TAMAMEN çıkarılıyordu; dubalardan iten
    # hiçbir kuvvet yoktu → gerçek parkurda gövde payı −0,23 m (TEMAS, Ç1).
    # Direğin payı ölçülen açıklıktan türer (planning_node._huni_payi):
    #     m = clamp( (en_yakın_kenar_mesafesi − gövde_genişliği − 2r)/2, 0, TAVAN )
    # → dar kapıda kendiliğinden küçülür, geçidi ASLA kapatmaz. Bu satır o
    # formülün TAVANI; ayrı bir sayı çünkü küresel mppi_obstacle_margin'i
    # büyütmek model gelmeyen kolu kırıyor (yukarıdaki nota bak), huni ise
    # sınıf yoksa hiç devreye girmediği için o kolu etkilemiyor.
    # Ölçüm (gerçek parkur, 8 kapı): tavan 1.0 → gövde payı −0,006 m (TEMAS) ·
    # 1.2 → +0,162 · 1.4 → +0,306 · 1.6 → +0,454 · 1.8 → +0,582.
    # ⚠ ÜST SINIR 1.8'DE: hakemin son noktası kapı direğine 2,0 m uzakta ve
    # 1.8'lik halka aracı 2,0 m'lik varış yarıçapına sokmuyor → 3/4 nokta.
    # 1.4 seçildi: pozitif pay + uçurumdan güvenli mesafe + 328 s (1.6'da 376 s).
    gate_post_margin_m: 1.4  # m, kapı direği ceza payının ÜST sınırı
    mode_name: "GUIDED"      # mod geçidi — mavros_bridge ile aynı olmalı
    map_rate_hz: 10.0        # Dosya-3 yerel harita yayım hızı
    use_rrt: true            # yarışma: RRT*. Video: hardware.yaml false override

fsm_node:
  ros__parameters:
    tick_rate_hz: 10.0       # görev yönetimi düşük frekans yeter
    # 5.0 → 3.0 (06.08): log 58'in gerçek IMU'sunda 270 s boyunca 1.5 g
    # üstü TEK örnek yok (otonom görevde maks 1.067 g). 3.0 = ölçülen
    # maksimumun 2 katı → manevra/dalga sahte tetik veremez, sert çarpışma
    # hâlâ erişebilir. ⚠ |a| YERÇEKİMİ DAHİL (durağanda 1.0 g).
    shock_threshold_g: 3.0   # |a|/g, kamikaze çarpma algılama
    last_waypoint_xy: [0.0, 0.0]  # [0,0]=DEVRE DIŞI (F12.1: kimse override
                             # etmiyordu; gerçek P1→P2 tetiği artık
                             # waypoint_reached index'i — bkz. fsm_node).
                             # Elle gerçek ENU koordinatı verilirse odom-mesafe
                             # yolu da çalışır (yedek).
    p1_to_p2_dist: 1.5       # m (CLAUDE.md FSM bölümü)
    start_on_mode: "GUIDED"  # md 3.3.1(3) YKİ'den başlatma: BEKLEMEDE'de
                             # operatör modu buna ÇEVİRİNCE görev başlar
                             # (QGC mod menüsü → MicoAir 868 telemetri). Kenar tetikli —
                             # önce ARM, SONRA GUIDED'a geç; boot'ta zaten
                             # GUIDED ise HOLD/MANUAL'a alıp geri dön.
                             # "" → kapalı (yalnız /girdap/mission/start).
    # F-V.6: BEKLEMEDE'ye armed girildiğinde mod ZATEN start_on_mode ise
    # (kenar yok) görev başlasın mı? YARIŞMA: false (GUIDED'dayken arm →
    # MPPI kendiliğinden sürerdi). AUTO VİDEO: hardware.yaml true yapar.
    start_on_arm_in_mode: false
    mission_file: ""         # Sprint 4 parkur katmanı görev dosyası (hardware.
                             # launch geçer). Boş → tek parkur (video), PARKUR_1

mavros_bridge_node:
  ros__parameters:
    heartbeat_timeout_s: 5.0     # /mavros/state sessizliği → KILL (CLAUDE.md)
    mode_name: "GUIDED"          # ArduRover otonomi modu (Şartname 4.1)
    monitor_rate_hz: 2.0         # güvenlik izleme döngüsü
    auto_guided: true            # bağlıyken mod hedefte değilse otomatik set_mode
    arming_retry_max: 3          # ArduRover pre-arm reddinde yeniden deneme
    arming_retry_delay_s: 2.0    # denemeler arası bekleme (EKF yakınsaması)
    # F-M.6: bağlantı kurulunca FC'den istenen MAVLink akış hızı (Hz).
    # ArduPilot taze bağlantıda SR0_* paramlarına göre ~1 Hz yayınlıyor (masa
    # Oturum 2 ölçümü) → Ekran-2 basamaklı, fusion 1 s bekçisi odom'u kesiyor,
    # MPPI bayat pozla plan yapıyor. Oturumluk istek; FC EEPROM'una YAZMAZ.
    # 0 → devre dışı. USB (SERIAL0) bant sorunu yok; 57600 seri hatta 10'u aşma.
    stream_rate_hz: 10

perception_lidar_node:
  ros__parameters:
    z_min: 0.1               # base_link'e göre su üstü kesim (m)
    z_max: 3.0               # yüksek yansımaları at (m)
    cluster_tolerance: 0.5   # Öklid clustering komşuluk yarıçapı (m)
    min_cluster_size: 5      # bu altı noise
    max_cluster_size: 500    # bu üstü büyük yapı (iskele/duvar) → bölünür (F5.4)
    split_cell_m: 1.0        # büyük küme bölme ızgarası XY hücre kenarı (m)
    max_range: 25.0          # yatay menzil filtresi (m)
    voxel_size: 0.1          # m, clustering öncesi voxel downsample (F5.3;
                             # 20k nokta/mesaj 10 Hz bütçesi; 0 = kapalı)
    log_period_s: 5.0        # engel sayısı INFO log periyodu

perception_camera_node:
  ros__parameters:
    clahe_clip_limit: 2.0    # su parlaması kontrast dengesi (CLAHE)
    clahe_tile: 8            # CLAHE karo ızgarası (8×8)
    min_area_px: 150         # bu altı kontur noise
    morph_kernel_px: 5       # maske açma/kapama çekirdeği (px)
    # F-P.21/gerçek yarış kararı (2026-07-17): YOLO katmanları VARSAYILAN
    # AÇIK — gerçek eğitilmiş model ışık değişimine HSV'den daha dayanıklı.
    # model_path boş kaldığı sürece güvenli mock'a düşer (kod yolu DEĞİŞMEDİ).
    # 2026-07-27: eğitilmiş duba lokalizatörü (best.pt) artık pakete GÖMÜLÜ
    # (models/best.pt → share'e kurulur). hardware.launch.py bunu otomatik
    # çözüp yolo_localizer_model_path'i doldurur; bu yaml'daki "" launch'ta
    # ezilir (yalnız node'u params.yaml ile TEK BAŞINA koşarsan geçerli —
    # o durumda buraya mutlak yol yaz). yolo_model_path (hedef/Parkur-3)
    # HÂLÂ boş = mock (best.pt hedef değil, tek-sınıf 'duba' lokalizatörü).
    use_yolo: true           # hedef sınıfı YOLO katmanı (Parkur-3)
    yolo_model_path: ""      # gerçek .pt yolu; boş = mock inference
    use_yolo_localizer: true # turuncu/sarı/kırmızı/yeşil/kahve için YOLO+HSV hibrit
    yolo_localizer_model_path: ""   # launch pakete-gömülü best.pt ile doldurur; boş = mock
    yolo_localizer_min_coverage: 0.15
    log_period_s: 5.0        # duba sayısı INFO log periyodu
    # HSV aralıkları (OpenCV: H 0-179, S/V 0-255) — RAL kodlarına yakın.
    # ⚠ SAHADA DOĞRULANMALI — 2026-07-16 gerçek donanım testinde akşamüstü
    # ışığında turuncu/sarı hiç tespit edilmedi (bkz. equalize_saturation).
    hsv_orange_lo: [5, 120, 120]     # turuncu (RAL 2003, şartname) alt sınır
    hsv_orange_hi: [20, 255, 255]
    hsv_yellow_lo: [21, 120, 120]    # sarı (RAL 1026, şartname) alt sınır
    hsv_yellow_hi: [35, 255, 255]
    # Kırmızı: OpenCV Hue sarmalanması İKİ aralık gerektirir (bkz. red_mask).
    hsv_red_lo1: [0, 120, 70]
    hsv_red_hi1: [8, 255, 255]
    hsv_red_lo2: [170, 120, 70]
    hsv_red_hi2: [179, 255, 255]
    hsv_green_lo: [40, 80, 60]
    hsv_green_hi: [85, 255, 255]
    # Kahverengi ≈ düşük-V turuncu — V üst sınırı turuncunun V alt sınırının
    # (120) altında tutulur ki iki sınıf çakışmasın.
    hsv_brown_lo: [5, 60, 40]
    hsv_brown_hi: [20, 255, 115]
    # F-P.21: ışık koşulu dayanıklılığı — doygunluk kanalı yüzdelik-dilim
    # germesiyle yeniden ölçeklenir (yalnız sahne GENELİNDE düşük doygunsa).
    saturation_clahe: true
    saturation_stretch_lo_pct: 1.0
    saturation_stretch_hi_pct: 99.0
    saturation_stretch_skip_above: 150.0

perception_fusion_node:
  ros__parameters:
    bearing_tolerance_rad: 0.15   # ~8.6° eşleşme kabul eşiği
    camera_hfov_rad: 1.2          # OAK-D Lite yatay FOV yaklaşık değeri
    # 2026-07-17: oakd_driver_node çözünürlüğü 1280x720'e çıkarıldı (bkz. o
    # dosyanın docstring'i — 640x480'de sahada 2m'deki duba bile net
    # görülemiyordu). BU DEĞER GERÇEK GÖRÜNTÜ BOYUTUYLA EŞLEŞMELİ, yoksa
    # bearing hesaplaması (bbox merkezi normalizasyonu) yanlış çıkar.
    camera_image_width_px: 1280   # /perception/buoys bbox normalizasyonu
    camera_image_height_px: 720
    sync_slop_s: 0.1               # ApproximateTimeSynchronizer toleransı
    # Eşleşme hiç olmuyorsa ÖNCE burayı büyüt, slop'u değil (tezgah 09.07:
    # damgalar aynı tabanda ~27 ms, arıza clustering gecikmesi; 10 ve 50
    # yetmedi, 100 tuttu). Kuyruk = kamera Hz × gecikme sn.
    sync_queue_size: 100           # sync geçmiş derinliği (LiDAR gecikme marjı)
    log_period_s: 5.0              # füzyon özet INFO log periyodu

telemetry_node:
  ros__parameters:
    csv_output_dir: ""       # boş → ~/girdap_logs/telemetry (MUTLAK; göreli yol
                             # systemd'de cwd=/ → PermissionError → Dosya-2 yok = 5 ceza)
    log_rate_hz: 2.0         # Şartname 4.2 ≥1 Hz garantisi
    # B2 — Ekran-2 kaynağı (md 3.3.1.1). VARSAYILAN = yarışma (GUIDED+MPPI).
    # AUTO video için hardware.yaml telemetry bloğu "fc" yapar.
    setpoint_source: "girdap"    # "girdap" (MPPI thrust N + cmd_vel) | "fc"
    fc_cruise_setpoint_mps: 1.0  # fc: FC'nin WP_SPEED'i ile SENKRON OLMALI
    # 🔴 11.08.2026 DÜZELTİLDİ (gerekçe hardware.yaml telemetry bloğunda):
    # ArduPilot 73=ThrottleLeft · 74=ThrottleRight; SERVO1_FUNCTION=74 → SAĞ.
    # §0.12c masa teyidi + log 58 + 19.07 param dökümü, üçü de aynı yönde.
    fc_thrust_left_ch: 3         # fc: SERVO3_FUNCTION=73 (ThrottleLeft) = SOL
    fc_thrust_right_ch: 1        # fc: SERVO1_FUNCTION=74 (ThrottleRight) = SAĞ
    fc_pwm_center: 1500          # nötr PWM (µs)
    fc_pwm_span: 500             # ±tam yetki (µs) → ±%100

local_map_node:
  ros__parameters:
    dump_rate_hz: 1.0        # Şartname 4.2 Dosya-3 ≥1 Hz garantisi
    output_dir: ""           # boş → ~/girdap_logs/local_map/session_.../

mission_manager_node:
  ros__parameters:
    mission_source: "file"   # "file" | "fc" — hardware.launch/CLI override eder (T0-f)
    mission_file: ""         # hardware.launch video_mission.yaml yolunu geçer
    publish_rate_hz: 5.0     # current_target yayımı (MPPI referansı taze)
    skip_home_seq0: true     # fc modu: ArduPilot görev index 0 = home, atla
    # F-M.1: bir waypoint mevcut konumdan bundan uzaksa görev REDDEDİLİR
    # (fix'siz (0,0) konum + gerçek koordinat = binlerce km sahte hedef).
    max_target_distance_m: 10000.0
    # fc modu görev config'i (file modunda mission_file YAML'ı kazanır):
    arrival_radius_m: 2.0    # waypoint "varıldı" yarıçapı (m)
    dwell_time_s: 2.0        # her waypoint'te bekleme (video netliği, s)
    cruise_velocity_mps: 1.0 # referans seyir hızı (MPPI hedef hızı)
